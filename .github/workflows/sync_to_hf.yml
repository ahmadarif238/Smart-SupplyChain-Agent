name: Sync to Hugging Face Hub
on:
  push:
    branches: [main] # or master, whichever you use

  # Allows re-running the sync by hand from the Actions tab.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Add Hugging Face Space configuration to README
        run: |
          set -e
          # Hugging Face reads a Space's configuration from YAML frontmatter at
          # the top of README.md. This repo's README is written for GitHub and
          # has none, so once the sync below started succeeding it replaced the
          # Space's own configured README and the Space failed to build with
          # "Missing configuration in README".
          #
          # The frontmatter is injected here rather than committed to the repo
          # so the GitHub README stays clean (GitHub renders frontmatter as an
          # ugly table at the top of the page).
          if head -1 README.md | grep -q '^---$'; then
            echo "Frontmatter already present; leaving README untouched."
            exit 0
          fi
          mv README.md README.github.md
          {
            printf -- '---\n'
            printf 'title: Smart Supply Chain Agent\n'
            printf 'emoji: "\U0001F916"\n'
            printf 'colorFrom: purple\n'
            printf 'colorTo: blue\n'
            printf 'sdk: docker\n'
            printf 'app_port: 7860\n'
            printf 'pinned: false\n'
            printf -- '---\n\n'
            cat README.github.md
          } > README.md
          rm README.github.md
          echo "Injected Space configuration:"
          head -10 README.md

      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

          # Publish the current tree as a single orphan commit rather than
          # pushing full history.
          #
          # Why: commit c1799e7 added a ~20MB .mp4 to this repo. Hugging Face
          # rejects any non-LFS file over 10MB, so pushing the real history was
          # refused outright -- silently leaving the Space pinned to whatever
          # was last deployed successfully (it had been failing since 2026-02).
          # A Space only ever needs the current state, so publishing one flat
          # commit sidesteps the oversized blob without rewriting this
          # repository's history.
          git checkout --orphan hf-deploy
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"

          # Fail loudly if the tree still contains something HF will reject.
          if find . -path ./.git -prune -o -type f -size +10M -print | grep -q .; then
            echo "::error::Files over 10MB present; Hugging Face will reject the push:"
            find . -path ./.git -prune -o -type f -size +10M -print
            exit 1
          fi

          git push -f \
            "https://ArifAntarctic7:$HF_TOKEN@huggingface.co/spaces/ArifAntarctic7/Smart-Supply-Chain-Agent" \
            hf-deploy:main
